[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-bb-360-images"
version = "1.0.0"
description = "Pipeline de Anotação Automatizada em Imagens 360 graus"
readme = "README.md"
authors = [
    { name = "Daniel Tavares", email = "danieloftavares@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "opencv-python",
    "omnicv",
    "autodistill",
    "autodistill-grounding-dino",
    "scikit-learn",
    "roboflow",
    "jinja2",
    "pyyaml",
    "typeguard",
    "transformers<4.40.0"
]

[project.urls]
Homepage = "https://github.com/Danntav/automation-bb-360-images"
